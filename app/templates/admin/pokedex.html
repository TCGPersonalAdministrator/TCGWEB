{% extends "base.html" %}
{% from "_macros.html" import sync_overlay %}

{% block title %}Pokédex · Administración{% endblock %}

{% block content %}
<h1>Pokédex</h1>
<p class="lead">Sincroniza todos los Pokémon desde PokeAPI hacia la base de datos.</p>

<button id="btn-sync-pokedex" type="button" class="btn btn-primary"><i class="bi bi-arrow-repeat"></i> Sincronizar Pokédex</button>

<div id="sync-result-banner" class="mt-3"></div>

{{ sync_overlay() }}
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/sync.js') }}"></script>
<script>
    initSyncButton("btn-sync-pokedex", "{{ url_for('admin.pokedex_sync_start') }}");
</script>
{% endblock %}
