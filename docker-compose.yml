services:
  mariadb:
    image: mariadb:11
    container_name: tcg-mariadb
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: admin1234
      MARIADB_USER: admin
      MARIADB_PASSWORD: admin1234
      MARIADB_DATABASE: tcg_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
